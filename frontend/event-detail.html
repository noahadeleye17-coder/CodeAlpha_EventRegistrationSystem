<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Event Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header>
  <h1>Event Registration</h1>
  <a href="index.html">Back to events</a>
</header>

<main>
  <div class="card" id="eventDetail">
    <p>Loading event...</p>
  </div>

  <div class="card" style="margin-top:1.5rem;">
    <h3>Register</h3>
    <form id="registerForm">
      <label for="name">Full name</label>
      <input type="text" id="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="phone">Phone (optional)</label>
      <input type="tel" id="phone" />

      <button type="submit" class="btn" style="margin-top:1rem;">Register</button>
    </form>
    <p id="registerMessage" style="margin-top:0.75rem;"></p>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
